events {
    worker_connections 1024;
}

http {
    upstream vault_backend {
        least_conn;
        server vault-0:8200 max_fails=3 fail_timeout=30s;
        server vault-1:8200 max_fails=3 fail_timeout=30s;
        server vault-2:8200 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8200;

        location / {
            proxy_pass http://vault_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Vault-specific headers
            proxy_set_header X-Vault-Request true;

            # Timeout settings for long-polling operations
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Disable buffering for streaming responses
            proxy_buffering off;
        }

        # Health check endpoint
        location /v1/sys/health {
            proxy_pass http://vault_backend/v1/sys/health;
            access_log off;
        }
    }
}
